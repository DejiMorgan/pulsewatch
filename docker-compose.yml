services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB: pulsewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: python -m app.worker
  dashboard:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
