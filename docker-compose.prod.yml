# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    ports: !reset []
  dashboard:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PULSEWATCH_DOMAIN: ${PULSEWATCH_DOMAIN:?Set PULSEWATCH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
volumes:
  caddy_data:
  caddy_config:
