name: PulseWatch CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Backend regression and SSRF tests
        env:
          DATABASE_URL: sqlite+pysqlite://
        run: python -m pytest -q
      - name: Fresh SQLite migration smoke test
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic current
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: pulsewatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsewatch -d pulsewatch_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pulsewatch:ci-only-secret@localhost:5432/pulsewatch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Migrate real PostgreSQL
        run: alembic upgrade head
      - name: PostgreSQL incident lifecycle smoke test
        run: python -m integration.postgres_smoke
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
